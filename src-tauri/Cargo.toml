[package]
name = "journey"
version = "0.1.0"
description = "A Tauri App"
authors = ["leuchthelp"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "journey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-persisted-scope = "2"
tauri-plugin-fs = "2"
musicbrainz_rs = { version = "0.13.0", features = ["sync"] }
tauri-plugin-os = "2"
uuid = { version = "^1.23.4", features = ["serde", "v7"] }
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "2.0.0-rc.4", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-uuid",
    "schema-sync",
    "entity-registry",
    "with-json",
] }
taurpc = "0.8.2"
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid"] }
specta-typescript = "0.0.12"
jellyfin-sdk-rs = {git = "https://github.com/leuchthelp/jellyfin-sdk-rs"}
url = "2.5.8"
reqwest = "0.13.4"
tauri-plugin-log = "2"
log = "0.4"
chrono = "0.4.45"
bon = "3.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
