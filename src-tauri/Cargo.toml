[package]
name = "journey"
version = "0.1.0"
description = "A Tauri App"
authors = ["leuchthelp"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "journey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
resolver = "3"
members = [
    "journey-api",
    "journey-db",
    "journey-keyring",
    "journey-provider",
    "journey-utils",
]

[workspace.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-persisted-scope = "2"
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2.6"
test-log = { version = "0.2", features = ["trace"] }
taurpc = "0.8.2"
strum = "0.28"
strum_macros = "0.28"
specta = { version = "2.0.0-rc.25", features = [
    "derive",
    "uuid",
    "url",
    "tokio",
] }
specta-typescript = "0.0.12"
bon = "3.9"
similar = "3.2.0"
url = { version = "2.5.8", features = ["serde"] }
rapidhash = "4.5.1"
chrono = "0.4.45"
reqwest = "0.13.4"
thiserror = "2.0.19"
inherent = "1.0"
async-trait = "0.1.91"
dyn-clone = "1.0.20"
anyhow = "1.0.104"
serial_test = "3.5.0"
futures = "0.3.33"
uuid = { version = "^1.23.4", features = ["serde", "v7", "zerocopy"] }
sea-orm = { version = "2.0.0-rc.43", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "schema-sync",
    "entity-registry",
    "serde",
    "with-uuid",
    "with-json",
] }
sea-query = "1.0.2"
journey-db = { path = "journey-db" }
journey-api = { path = "journey-api" }
journey-utils = { path = "journey-utils" }
journey-keyring = { path = "journey-keyring" }
journey-provider = { path = "journey-provider" }

dotenvy = { git = "https://github.com/allan2/dotenvy", features = ["macros"] }


[workspace.lints.rust]
unsafe_code = "forbid"
unconditional_panic = "forbid"

[dependencies]
tauri = { workspace = true }
tauri-plugin-persisted-scope = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-fs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
taurpc = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
sea-orm = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
journey-api = { workspace = true }
journey-keyring = { workspace = true }
journey-provider = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = { workspace = true }
