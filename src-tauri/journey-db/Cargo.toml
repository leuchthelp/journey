[package]
name = "journey-db"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "^1.23.4", features = ["serde", "v7"] }
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "2.0.0-rc", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-uuid",
    "schema-sync",
    "entity-registry",
    "with-json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

taurpc = "0.8.2"
specta = { version = "2.0.0-rc.25", features = ["derive", "uuid"] }
